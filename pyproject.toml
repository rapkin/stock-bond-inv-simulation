[project]
name = "invsim"
version = "1.0.0"
description = "Biweekly DCA investment simulator with inflation adjustment and MPT portfolio optimization"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.28",
    "pandas>=2.0.0",
    "pandas-datareader>=0.10.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
invsim = "invsim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
